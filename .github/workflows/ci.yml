# CI per «Mappa Concettuale 3 Passi»
# A ogni push (o pull request) verso main/master:
#   1. installa le dipendenze dal lockfile (versioni identiche)
#   2. type-check TypeScript (pnpm check)
#   3. build di produzione (client + server)
# L'artefatto dist/ viene salvato come "artifact" scaricabile dalla pagina Actions.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Install · Check · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4   # la versione la legge dal campo packageManager

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
